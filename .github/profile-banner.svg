<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Background: deep space gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1f3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#58a6ff" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Glow behind logo -->
  <circle cx="640" cy="280" r="200" fill="url(#glow)"/>

  <!-- Center: satellite logo -->
  <g transform="translate(640, 180)" opacity="0.95">
    <!-- Antenna dish -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#f97316" stroke-width="3"/>
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#f97316" stroke-width="2"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#f97316" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#fbbf24"/>
    <!-- Dish -->
    <path d="M -50 40 A 50 50 0 0 1 50 40" fill="none" stroke="#58a6ff" stroke-width="3"/>
    <line x1="0" y1="40" x2="0" y2="90" stroke="#58a6ff" stroke-width="2"/>
  </g>

  <!-- Brand name (centered) -->
  <text x="640" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="800" fill="#f0f6fc" text-anchor="middle">
    goplay-source
  </text>

  <!-- Tagline -->
  <text x="640" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="500" fill="#8b949e" text-anchor="middle">
    开源 IPTV 工具团队 · Free open-source tools &amp; live stream utilities
  </text>

  <!-- Accent bar separator -->
  <rect x="530" y="430" width="220" height="6" fill="url(#bar)" rx="3"/>

  <!-- 3 repo cards (centered, no taobao link) -->
  <g transform="translate(0, 460)">
    <!-- Card 1: IPTV-tools (tool) -->
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="300" height="90" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">
        📺 IPTV-tools
      </text>
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#8b949e">
        Desktop batch source tester
      </text>
      <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#f97316">
        8,000+ channels · M3U sync
      </text>
    </g>

    <!-- Card 2: iptv-search.com (online) -->
    <g transform="translate(490, 0)">
      <rect x="0" y="0" width="300" height="90" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">
        🔎 iptv-search.com
      </text>
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#8b949e">
        Free channel directory
      </text>
      <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#f97316">
        16,700+ indexed · 177 groups
      </text>
    </g>

    <!-- Card 3: future slot (placeholder) -->
    <g transform="translate(860, 0)">
      <rect x="0" y="0" width="300" height="90" rx="12" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#8b949e">
        ＋ More tools
      </text>
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#8b949e">
        持续开发中 / in progress
      </text>
    </g>
  </g>

  <!-- Bottom badges row -->
  <g transform="translate(80, 570)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="#1f6feb"/>
    <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">🐍 Python 3.10+</text>

    <rect x="180" y="0" width="280" height="40" rx="20" fill="#21262d" stroke="#30363d"/>
    <text x="320" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#c9d1d9" text-anchor="middle">💻 Win / macOS / Linux</text>

    <rect x="480" y="0" width="100" height="40" rx="20" fill="#21262d" stroke="#30363d"/>
    <text x="530" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#c9d1d9" text-anchor="middle">📜 MIT</text>

    <rect x="600" y="0" width="180" height="40" rx="20" fill="#21262d" stroke="#30363d"/>
    <text x="690" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#f97316" text-anchor="middle">🛰️ 6h auto-sync</text>
  </g>

  <!-- Bottom-right URL -->
  <text x="1200" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#58a6ff" text-anchor="end">
    github.com/goplay-source
  </text>
</svg>
